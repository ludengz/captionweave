[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "captionweave"
version = "0.1.0"
description = "Resumable subtitles with assistant-driven translation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "CaptionWeave contributors"}]
requires-python = ">=3.11"
keywords = ["subtitles", "transcription", "translation", "whisper", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.optional-dependencies]
asr = [
    "faster-whisper==1.2.1", "ctranslate2==4.8.1", "numpy>=1.26,<3",
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
metal = [
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=1.26,<3",
]
test = ["build>=1.2"]

[project.scripts]
captionweave = "captionweave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
