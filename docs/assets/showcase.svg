<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Video in. Subtitles out.</title>
  <desc id="description">Illustrative subtitles generated from speech: A new day begins, translated into Spanish and Japanese, aligned from one to three seconds.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .label { fill: #929697; font-size: 14px; letter-spacing: 2px; }
    .caption { fill: #f3f1eb; font-size: 38px; font-weight: 400; letter-spacing: -0.8px; }
    .time { fill: #b2b6b6; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 15px; }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="#111415" stroke="#303536"/>
  <text class="label" x="64" y="63">VIDEO IN. SUBTITLES OUT.</text>
  <path d="M64 99H1136" stroke="#303536"/>
  <path d="M401 139V288M771 139V288" stroke="#303536"/>

  <text class="label" x="64" y="160">ENGLISH</text>
  <text class="caption" x="64" y="222">A new day</text>
  <text class="caption" x="64" y="269">begins.</text>

  <text class="label" x="434" y="160">ESPAÑOL</text>
  <text class="caption" x="434" y="222">Empieza un</text>
  <text class="caption" x="434" y="269">nuevo día.</text>

  <text class="label" x="804" y="160">JAPANESE</text>
  <g fill="#f3f1eb" font-size="34" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif">
    <text x="804" y="222">新しい一日が</text>
    <text x="804" y="269">始まる。</text>
  </g>

  <path d="M64 335H1136" stroke="#434a4b"/>
  <path d="M64 331V339M1136 331V339" stroke="#c9ccca"/>
  <text class="time" x="64" y="372">00:00:01,000</text>
  <text class="time" x="1136" y="372" text-anchor="end">00:00:03,000</text>
</svg>
